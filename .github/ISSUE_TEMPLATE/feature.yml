name: Feature proposal
description: Propose a bounded local-first capability.
title: "proposal: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What reproducibility or evidence gap does this address?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Verifiable acceptance criteria
      description: List files, commands, outputs, or test cases that can prove completion.
    validations:
      required: true

  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: This does not require cloud login, printer control, telemetry, or model upload.
          required: true
        - label: This does not require redistributing a slicer or proprietary plugin.
          required: true

