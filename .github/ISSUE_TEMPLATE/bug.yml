name: Reproducible bug
description: Report a local OpenPrintBench behavior with redacted evidence.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach credentials, printer serials, private models, proprietary
        profiles, local usernames, or generated files you cannot redistribute.

  - type: input
    id: version
    attributes:
      label: OpenPrintBench version
      placeholder: 0.1.0.dev0
    validations:
      required: true

  - type: input
    id: slicer
    attributes:
      label: Slicer and version
      placeholder: Bambu Studio 02.06.00.51
    validations:
      required: true

  - type: dropdown
    id: evidence-state
    attributes:
      label: Evidence state
      options:
        - Probe
        - Plan
        - Run
        - Physical validation
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include exact commands with private paths replaced by placeholders.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and provenance
      options:
        - label: I removed credentials, serials, usernames, and absolute home paths.
          required: true
        - label: I may legally redistribute every attached fixture and profile.
          required: true

