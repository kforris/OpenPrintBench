[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "openprintbench"
version = "0.1.0.dev0"
description = "Local-first slicing regression plans and physical-print evidence for desktop slicers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "ZIXUAN Wang" },
]
keywords = ["3d-printing", "slicer", "bambu-studio", "orcaslicer", "regression-testing"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kforris/OpenPrintBench"
Issues = "https://github.com/kforris/OpenPrintBench/issues"
Source = "https://github.com/kforris/OpenPrintBench"

[project.scripts]
openprintbench = "openprintbench.cli:main"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openprintbench"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["openprintbench"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["openprintbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

